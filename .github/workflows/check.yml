# The engine tests, on every push to main and every pull request. There is
# nothing to install: the engine and its tests have no dependencies, which is
# the point.
#
# Two jobs since iteration 3: the engine tests, and the UI check now that
# public/index.html has a table. The second is the only thing in this repo that
# is not dependency-free — it needs playwright-core and a Chromium.
name: check

# push is filtered to main: without the filter every commit on a pull request
# branch runs the suite twice, once for the push and once for the pull request,
# and one of those runs downloads a Chromium.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      # Not `--test tools/`: Node 22 reads a bare directory as a module path and
      # fails with MODULE_NOT_FOUND. A glob is what the current LTS discovers.
      #
      # Until iteration 1 writes the first test the glob matches nothing, and
      # Node reports "1..0" and exits 0 — so this job is green without having
      # asserted anything. That is the scaffold's honest state, not a pass:
      # the job starts meaning something the moment tools/engine.test.mjs
      # exists, and nothing here needs changing when it does.
      # No install first: the engine and its tests still have no dependencies.
      - run: node --test 'tools/**/*.test.mjs'

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      # playwright-core is the one dependency this repo has, and it is a dev
      # one: it belongs to the check, not to the game. `npm ci` restores the
      # exact version the lockfile names, so CI and a local run measure the
      # page with the same browser build. --with-deps is what makes Chromium
      # start on a bare runner.
      #
      # No CHROME here: check_ui.mjs falls back to the browser this install
      # puts in playwright's own cache, which is the only one CI has.
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: npm run check
